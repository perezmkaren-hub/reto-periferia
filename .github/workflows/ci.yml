name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript estricto)
        run: npm run typecheck
      - name: Pruebas automáticas
        run: npm test
      - name: Demo sin modelo
        run: npm run demo
      - name: Módulo reutilizable sin divergencias
        run: npm run modulo:verificar
